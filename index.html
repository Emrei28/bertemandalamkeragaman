<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lengkapi Cerita — Bahasa Indonesia Kelas 2 SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root { --bg:#F0F7FF; --card-bg:#FFF; --primary:#2563EB; --success:#16A34A; --danger:#DC2626; --text:#1E293B; --border:#CBD5E1; --accent:#F59E0B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Quicksand',sans-serif; margin:0; padding:12px; display:flex; justify-content:center; }
  .container { width:100%; max-width:650px; background:var(--card-bg); padding:18px; border-radius:20px; box-shadow:0 10px 25px -5px rgba(0,0,0,.05); }
  header { text-align:center; margin-bottom:12px; }
  h1 { font-family:'Fredoka',sans-serif; color:var(--primary); margin:0 0 6px; font-size:1.6rem; }
  p { margin:0; color:#64748B; font-size:.92rem; font-weight:600; }

  /* Bank kata: menempel di atas layar agar tidak perlu scroll */
  .bank-box { position:sticky; top:0; z-index:50; background:#EFF6FF; border:2px dashed #93C5FD; border-radius:16px; padding:12px; margin-bottom:16px; box-shadow:0 6px 12px -6px rgba(37,99,235,.25); }
  .bank-title { font-size:.8rem; font-weight:700; color:#1D4ED8; margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
  .bank-row { display:flex; flex-wrap:wrap; gap:8px; min-height:44px; align-items:center; }
  .bank-hint { font-size:.85rem; color:#1D4ED8; font-weight:700; }

  .chip { background:var(--primary); color:#FFF; padding:4px 14px; border-radius:10px; font-weight:700; font-size:1rem; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; box-shadow:0 2px 4px rgba(37,99,235,.2); display:inline-flex; align-items:center; justify-content:center; height:44px; min-width:64px; transition:transform .15s, background-color .2s, box-shadow .2s; }
  .chip.dragging { opacity:.3; }
  .chip.selected { background:var(--accent); transform:translateY(-3px) scale(1.06); box-shadow:0 0 0 3px #FDE68A, 0 6px 10px rgba(245,158,11,.4); }
  .chip-fly { position:fixed !important; z-index:1500 !important; margin:0 !important; transition:all .5s cubic-bezier(.2,.8,.2,1) !important; pointer-events:none; background:var(--primary) !important; color:#FFF !important; }

  .quiz-list { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
  .quiz-card { background:#F8FAFC; border:2px solid var(--border); padding:12px 14px; border-radius:16px; display:flex; align-items:center; gap:12px; }
  .icon { font-size:1.8rem; flex-shrink:0; }
  .sentence { font-size:1.02rem; font-weight:700; line-height:2.4; width:100%; }

  .dropzone { display:inline-flex; align-items:center; justify-content:center; min-width:96px; height:44px; border:2px dashed #94A3B8; border-radius:10px; background:#FFF; color:#94A3B8; font-size:.9rem; font-weight:700; margin:0 4px; vertical-align:middle; transition:all .2s; overflow:hidden; cursor:pointer; touch-action:manipulation; }
  .dropzone .chip { width:100%; height:100%; border-radius:8px; box-shadow:none; transform:none; }
  .dropzone.target { border-color:var(--accent); border-style:solid; background:#FFFBEB; box-shadow:0 0 0 3px #FDE68A; animation:pulse 1s infinite; }
  .dropzone.has-item { border-style:solid; border-color:var(--primary); background:#F0F7FF; }
  .dropzone.correct { border-style:solid; border-color:var(--success) !important; background:#DCFCE7 !important; animation:none; box-shadow:none; }
  .dropzone.correct .chip { background:var(--success) !important; cursor:default; }
  .dropzone.wrong { border-style:solid; border-color:var(--danger) !important; background:#FEE2E2 !important; animation:shake .3s ease-in-out; }
  .dropzone.wrong .chip { background:var(--danger) !important; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px #FEF3C7; } }

  .result-box { text-align:center; font-size:1rem; font-weight:700; margin-bottom:14px; display:none; }
  .action-area { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .btn { border:none; padding:14px 30px; border-radius:12px; font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 4px 6px -1px rgba(0,0,0,.1); }
  .btn-check { background:var(--primary); color:#fff; }
  .btn-check:disabled { opacity:.6; }
  .btn-reset { background:transparent; color:#64748B; text-decoration:underline; box-shadow:none; font-size:.9rem; padding:10px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.6); display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .3s; z-index:2000; }
  .modal-overlay.active { opacity:1; pointer-events:auto; }
  .modal-card { background:#fff; padding:28px 22px; border-radius:24px; text-align:center; max-width:400px; width:100%; transform:scale(.8); transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
  .modal-overlay.active .modal-card { transform:scale(1); }
  .modal-badge { font-size:3.5rem; margin-bottom:10px; }
  .modal-card h2 { font-family:'Fredoka',sans-serif; color:var(--success); margin:0 0 8px; font-size:1.7rem; }
  .modal-card p { color:#475569; margin:0 0 20px; }
  .btn-modal { background:var(--success); color:#fff; width:100%; }

  @media (max-width:420px) { .container{padding:14px} h1{font-size:1.4rem} .sentence{font-size:.98rem} }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>✏️ Lengkapi Ceritanya!</h1>
    <p>Ketuk kata, lalu ketuk kotak yang kosong. Boleh juga ditarik.</p>
  </header>

  <div class="bank-box">
    <div class="bank-title">💡 Pilihan Kata:</div>
    <div class="bank-row" id="word-bank"></div>
  </div>

  <div class="quiz-list" id="quiz-list"></div>
  <div class="result-box" id="result-box"></div>

  <div class="action-area">
    <button class="btn btn-check" id="btn-check" onclick="cekJawaban()">✅ Cek Jawaban</button>
    <button class="btn btn-reset" onclick="resetGameDengAnimasi()">🔄 Ulangi Game</button>
  </div>
</div>

<div class="modal-overlay" id="reward-modal">
  <div class="modal-card">
    <div class="modal-badge">🏆🌟</div>
    <h2>Luar Biasa!</h2>
    <p>Hebat sekali, kamu berhasil menyelesaikan semua soal dengan benar!</p>
    <button class="btn btn-modal" onclick="prosesMainLagi()">🎮 Main Lagi</button>
  </div>
</div>

<script>
const masterSoalData = [
  { id:1, emoji:'🌧️', awal:'Baju Budi basah kuyup karena hujan turun sangat', jawaban:'deras', akhir:'.' },
  { id:2, emoji:'🍦', awal:'Es krim ini rasanya manis dan terasa', jawaban:'dingin', akhir:' di lidah.' },
  { id:3, emoji:'📚', awal:'Siti anak yang', jawaban:'rajin', akhir:', ia selalu membaca buku setiap hari.' },
  { id:4, emoji:'🧹', awal:'Ruang kelas terlihat', jawaban:'bersih', akhir:' setelah disapu bersama-sama.' }
];

const quizList = document.getElementById('quiz-list');
const wordBank = document.getElementById('word-bank');
let soalAktif = [];
let selectedChip = null;   // kata yang sedang dipilih (tap)
let selectedZone = null;   // kotak yang sedang dipilih (tap)

const acakArray = arr => [...arr].sort(() => Math.random() - 0.5);

function renderSoal() {
  quizList.innerHTML = '';
  soalAktif = acakArray(masterSoalData);
  soalAktif.forEach(item => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.innerHTML = `<div class="icon">${item.emoji}</div>
      <div class="sentence">${item.awal} <div class="dropzone" data-jawaban="${item.jawaban}">...</div>${item.akhir}</div>`;
    quizList.appendChild(card);
  });
  document.querySelectorAll('.dropzone').forEach(z => z.addEventListener('click', () => onZoneTap(z)));
}

function inisialisasiBankKata() {
  wordBank.innerHTML = '';
  acakArray(soalAktif.map(s => s.jawaban)).forEach(kata => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = kata;
    chip.dataset.kata = kata;
    makeDraggable(chip);
    wordBank.appendChild(chip);
  });
}

function inisialisasiGame() {
  clearSelection();
  renderSoal();
  inisialisasiBankKata();
}

/* ---------- Tap & Match ---------- */
function clearSelection() {
  if (selectedChip) selectedChip.classList.remove('selected');
  if (selectedZone) selectedZone.classList.remove('target');
  selectedChip = null; selectedZone = null;
}

function refreshZones() {
  document.querySelectorAll('.dropzone').forEach(z => {
    if (z.querySelector('.chip')) z.classList.add('has-item');
    else { z.textContent = '...'; z.classList.remove('has-item'); }
  });
}

// Taruh kata ke kotak (kata lama di kotak itu kembali ke bank)
function placeChip(chip, zone) {
  if (zone.classList.contains('correct')) return;
  const old = zone.querySelector('.chip');
  if (old && old !== chip) wordBank.appendChild(old);
  zone.innerHTML = '';
  zone.appendChild(chip);
  chip.classList.remove('selected');
  clearSelection();
  refreshZones();
  resetWrongStylesOnly();
}

function onChipTap(chip) {
  const zone = chip.parentElement;
  if (zone.classList.contains('dropzone')) {          // kata sudah di kotak → kembalikan ke bank
    if (zone.classList.contains('correct')) return;
    wordBank.appendChild(chip);
    clearSelection();
    refreshZones();
    resetWrongStylesOnly();
    return;
  }
  if (selectedZone) { placeChip(chip, selectedZone); return; }   // kotak sudah dipilih dulu
  const sama = selectedChip === chip;
  clearSelection();
  if (!sama) { selectedChip = chip; chip.classList.add('selected'); }
}

function onZoneTap(zone) {
  if (zone.classList.contains('correct')) return;
  if (zone.querySelector('.chip')) return;              // ditangani onChipTap
  if (selectedChip) { placeChip(selectedChip, zone); return; }
  const sama = selectedZone === zone;
  clearSelection();
  if (!sama) { selectedZone = zone; zone.classList.add('target'); }
}

/* ---------- Drag (tetap bisa) + Tap dalam satu handler ---------- */
function makeDraggable(el) {
  el.addEventListener('pointerdown', (e) => {
    if (el.parentElement.classList.contains('correct')) return;
    const startX = e.clientX, startY = e.clientY;
    let clone = null, moved = false;

    function onMove(ev) {
      if (!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 10) return;
      if (!moved) {
        moved = true;
        resetWrongStylesOnly();
        clone = el.cloneNode(true);
        clone.classList.remove('selected');
        Object.assign(clone.style, { position:'fixed', zIndex:1000, pointerEvents:'none', width:el.offsetWidth+'px' });
        document.body.appendChild(clone);
        el.classList.add('dragging');
      }
      clone.style.left = (ev.clientX - el.offsetWidth / 2) + 'px';
      clone.style.top = (ev.clientY - 22) + 'px';
    }

    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);

      if (!moved) { onChipTap(el); return; }   // hanya ketukan

      clone.remove();
      el.classList.remove('dragging');
      let dropped = false;
      document.querySelectorAll('.dropzone').forEach(zone => {
        const r = zone.getBoundingClientRect();
        if (!dropped && ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom && !zone.classList.contains('correct')) {
          placeChip(el, zone);
          dropped = true;
        }
      });
      if (!dropped) {
        const b = wordBank.getBoundingClientRect();
        if (ev.clientX >= b.left && ev.clientX <= b.right && ev.clientY >= b.top && ev.clientY <= b.bottom) {
          wordBank.appendChild(el);
          clearSelection();
        }
      }
      refreshZones();
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

/* ---------- Cek jawaban ---------- */
function cekJawaban() {
  clearSelection();
  const dropzones = document.querySelectorAll('.dropzone');
  let benar = 0, terisi = 0, wrongZones = [];

  dropzones.forEach(zone => {
    const chip = zone.querySelector('.chip');
    if (!chip) return;
    terisi++;
    if (chip.dataset.kata === zone.dataset.jawaban) { zone.classList.add('correct'); benar++; }
    else { zone.classList.add('wrong'); wrongZones.push({ zone, chip }); }
  });

  const resultBox = document.getElementById('result-box');

  if (terisi < dropzones.length) {
    resultBox.style.display = 'block';
    resultBox.style.color = '#D97706';
    resultBox.textContent = '⚠️ Isilah semua titik-titik terlebih dahulu ya!';
    wrongZones.forEach(i => i.zone.classList.remove('wrong'));
    return;
  }

  if (benar === dropzones.length) {
    resultBox.style.display = 'none';
    tampilkanModalApresiasi();
  } else {
    resultBox.style.display = 'block';
    resultBox.style.color = 'var(--danger)';
    resultBox.textContent = '💪 Ada jawaban yang belum tepat. Perhatikan kata yang kembali ke atas!';
    const btnCheck = document.getElementById('btn-check');
    btnCheck.disabled = true;
    setTimeout(() => {
      wrongZones.forEach(i => {
        i.zone.classList.remove('wrong', 'has-item');
        i.zone.textContent = '...';
        wordBank.appendChild(i.chip);
      });
      btnCheck.disabled = false;
    }, 1200);
  }
}

function resetWrongStylesOnly() {
  document.querySelectorAll('.dropzone').forEach(z => { if (!z.classList.contains('correct')) z.classList.remove('wrong'); });
  document.getElementById('result-box').style.display = 'none';
}

function tampilkanModalApresiasi() {
  if (typeof confetti === 'function') confetti({ particleCount:100, spread:70, origin:{ y:.6 } });
  document.getElementById('reward-modal').classList.add('active');
}

function prosesMainLagi() {
  document.getElementById('reward-modal').classList.remove('active');
  setTimeout(resetGameDengAnimasi, 300);
}

/* ---------- Reset dengan animasi terbang ---------- */
function resetGameDengAnimasi() {
  clearSelection();
  const activeChips = Array.from(document.querySelectorAll('.dropzone .chip'));
  if (activeChips.length === 0) { inisialisasiGame(); return; }

  document.getElementById('btn-check').disabled = true;
  wordBank.innerHTML = '';

  const targetMap = activeChips.map(chip => {
    const t = document.createElement('div');
    t.className = 'chip';
    t.textContent = chip.textContent;
    t.style.visibility = 'hidden';
    wordBank.appendChild(t);
    return { oldChip: chip, targetChip: t };
  });

  let completed = 0;
  targetMap.forEach((item, index) => {
    setTimeout(() => {
      const s = item.oldChip.getBoundingClientRect();
      const t = item.targetChip.getBoundingClientRect();
      const flyer = document.createElement('div');
      flyer.className = 'chip chip-fly';
      flyer.textContent = item.oldChip.textContent;
      Object.assign(flyer.style, { left:s.left+'px', top:s.top+'px', width:s.width+'px', height:s.height+'px' });
      document.body.appendChild(flyer);

      item.oldChip.style.opacity = '0';
      const pz = item.oldChip.parentElement;
      if (pz) { pz.textContent = '...'; pz.classList.remove('has-item', 'correct', 'wrong'); }

      requestAnimationFrame(() => {
        Object.assign(flyer.style, { left:t.left+'px', top:t.top+'px', width:t.width+'px', height:t.height+'px' });
      });

      setTimeout(() => {
        flyer.remove();
        item.targetChip.style.visibility = 'visible';
        if (++completed === targetMap.length) {
          document.getElementById('btn-check').disabled = false;
          inisialisasiGame();
        }
      }, 500);
    }, index * 120);
  });

  document.getElementById('result-box').style.display = 'none';
}

inisialisasiGame();
</script>
</body>
</html>
